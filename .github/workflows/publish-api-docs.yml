name: Publish API reference

on:
  push:
    branches: [main]
    paths:
      - "openapi.json"
      - "api-docs/**"
      - ".github/workflows/publish-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble docs site
        run: |
          mkdir -p site
          cp api-docs/index.html site/index.html
          cp openapi.json site/openapi.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
